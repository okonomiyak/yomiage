[package]
name = "yomiage-bot"
version = "0.1.0"
edition = "2024"

# API 破壊が多いクレートは `=` で完全固定する（PLAN §0）。
# 上げるときは docs.rs / examples を読み直してから上げること。
[dependencies]
poise = "=0.6.2"
serenity = { version = "=0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "collector",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
    "voice",
] }
songbird = "=0.6.0"

anyhow = "1.0.104"
dotenvy = "0.15.7"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
