[package]
name = "yomiage-bot"
version = "0.1.0"
edition = "2024"

# 読み上げ(tts-bot)と音楽(music-bot)は別プロセス・別 Discord アプリ（PLAN §13）。
# 共有ロジックだけ lib に置き、各バイナリは src/bin/ 以下に持つ。
[lib]
name = "yomiage_bot"
path = "src/lib.rs"

# API 破壊が多いクレートは `=` で完全固定する（PLAN §0）。
# 上げるときは docs.rs / examples を読み直してから上げること。
[dependencies]
poise = "=0.6.2"
serenity = { version = "=0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "collector",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
    "voice",
] }
# builtin-queue: 音楽のキューを songbird に任せる（自前で持つと再生完了の検知と
# 状態の同期を自分で書くことになる）。読み上げは play_input で直接鳴らすのでキューに入らない。
songbird = { version = "=0.6.0", features = ["builtin-queue"] }

anyhow = "1.0.104"
dotenvy = "0.15.7"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    # process: ニコニコのメタデータ取得で yt-dlp を待つ（同期の std::process だと
    # 数秒ワーカースレッドを止めてしまう）。songbird が同じ理由で有効にしている。
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"

# songbird は symphonia を default-features = false で入れており、コーデックを一切有効化しない。
# ここで有効にしたものだけが再生できる。消すと該当形式が黙って再生できなくなる。
#   wav / pcm  : VOICEVOX ENGINE が返す wav
#   mkv        : YouTube の音声のみ形式（webm）。Opus デコーダは songbird が足す
#   isomp4/aac : YouTube が m4a を返してきたとき用
#   mp3        : /up_play でアップロードされた MP3 用
symphonia = { version = "0.5.5", default-features = false, features = [
    "wav",
    "pcm",
    "mkv",
    "isomp4",
    "aac",
    "mp3",
] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "tls-none"] }
regex = "1"
uuid = "1"

[profile.release]
lto = "thin"
strip = true
