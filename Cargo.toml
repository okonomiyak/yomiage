[package]
name = "yomiage-bot"
version = "0.1.0"
edition = "2024"

# API 破壊が多いクレートは `=` で完全固定する（PLAN §0）。
# 上げるときは docs.rs / examples を読み直してから上げること。
[dependencies]
poise = "=0.6.2"
serenity = { version = "=0.12.5", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "collector",
    "gateway",
    "http",
    "model",
    "rustls_backend",
    "utils",
    "voice",
] }
songbird = "=0.6.0"

anyhow = "1.0.104"
dotenvy = "0.15.7"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"

# songbird は symphonia を default-features = false で入れており、コーデックを一切有効化しない。
# wav を再生するにはこちらで wav（RIFF リーダ）と pcm（デコーダ）を有効にする必要がある。
# 消すと ENGINE の wav が再生できなくなる。
symphonia = { version = "0.5.5", default-features = false, features = [
    "wav",
    "pcm",
] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "tls-none"] }
regex = "1"

[profile.release]
lto = "thin"
strip = true
