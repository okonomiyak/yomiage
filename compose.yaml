services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-0.25.2   # latest は使わない（2026-07 時点の安定版）
    container_name: voicevox
    restart: unless-stopped
    environment:
      - VV_CPU_NUM_THREADS=2
    expose:
      - "50021"           # ホストには公開せず内部ネットワークのみ
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50021/version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [yomiage]

  yomiage-bot:
    build: .
    container_name: yomiage-bot
    restart: unless-stopped
    depends_on:
      voicevox:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # 同じ compose ネットワーク内なので、ENGINE をホストに公開する必要はない。
      - VOICEVOX_URL=http://voicevox:50021
      - DATABASE_URL=sqlite:/data/bot.db
      - RUST_LOG=${RUST_LOG:-info,yomiage_bot=debug}
      # スラッシュコマンドの登録先。値があるとそのサーバーだけに即時登録される。
      # 空にするとグローバル登録になる（反映に最大 1 時間）。
      - GUILD_ID=${GUILD_ID:-}
    volumes:
      - ./data:/data
    networks: [yomiage]

networks:
  yomiage:
