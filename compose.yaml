services:
  voicevox:
    image: voicevox/voicevox_engine:nvidia-0.26.0   # latest は使わない。0.26.0 以上でストリーミング合成が使える
    container_name: voicevox
    restart: unless-stopped
    runtime: nvidia
    # ENGINE は長文を合成するとメモリを抱えたまま返さず、話者ごとに積み上がる（PLAN §13-18）。
    # LXC（10GB）ごと詰まる前に ENGINE だけを落とし、restart で自動復帰させる。
    # スワップも同じ値にして、スワップに逃げて遅くなるのを防ぐ。
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VV_CPU_NUM_THREADS=2
    expose:
      - "50021"           # ホストには公開せず内部ネットワークのみ
    healthcheck:
      # 0.26.0 からイメージに curl が無いので、bash の /dev/tcp で /version を叩く。
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/50021 && printf 'GET /version HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [yomiage]

  # 読み上げと音楽は別プロセス・別 Discord アプリ（PLAN §13）。同じ VC に両方が
  # 接続して音声を混ぜる。イメージは共通（Dockerfile が両方のバイナリを積む）で、
  # command でどちらを起動するかだけ切り替える。
  tts-bot:
    build: .
    container_name: yomiage-tts
    command: ["tts-bot"]
    restart: unless-stopped
    depends_on:
      voicevox:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${TTS_DISCORD_TOKEN}
      # 同じ compose ネットワーク内なので、ENGINE をホストに公開する必要はない。
      - VOICEVOX_URL=http://voicevox:50021
      - DATABASE_URL=sqlite:/data/bot.db
      - RUST_LOG=${RUST_LOG:-info,yomiage_bot=debug,tts_bot=debug}
      # スラッシュコマンドの登録先。値があるとそのサーバーだけに即時登録される。
      # 空にするとグローバル登録になる（反映に最大 1 時間）。
      - GUILD_ID=${GUILD_ID:-}
      # 収録済み音声素材の置き場。無ければ空のまま起動し、合成のみで動く。
      - EXVOICE_DIR=/exvoice
    volumes:
      # data/ は tts-bot と music-bot で共有する（guild_settings・辞書・お気に入り
      # などのスキーマが共通のため）。SQLite は WAL + busy_timeout で同時アクセスに耐える。
      - ./data:/data
      # 素材はリポジトリに入れない（配布物）。サーバーに直接置く。
      - ./exVOICE:/exvoice:ro
    networks: [yomiage]

  music-bot:
    build: .
    container_name: yomiage-music
    command: ["music-bot"]
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${MUSIC_DISCORD_TOKEN}
      - DATABASE_URL=sqlite:/data/bot.db
      - RUST_LOG=${RUST_LOG:-info,yomiage_bot=debug,music_bot=debug}
      - GUILD_ID=${GUILD_ID:-}
      # ニコニコのログイン済み Cookie（会員限定・センシティブ指定の動画用）。
      # 置き場は data/ の中にする。専用の bind mount にすると、ファイルを
      # 置き忘れたときに Docker が**ディレクトリとして作ってしまう**ため。
      # data/ は既に書き込み可能でマウントしてあり、yt-dlp の書き戻しも通る。
      # ファイルが無ければ認証なしで動く（公開動画だけ再生できる）。
      - NICO_COOKIES=${NICO_COOKIES:-/data/nico_cookies.txt}
    volumes:
      - ./data:/data
    networks: [yomiage]

networks:
  yomiage:
